[project]
name = "logscope-triage"
version = "0.5.0"
description = "LogScope 日志分流 CLI：Drain3 模板化 + hilog/HiSysEvent/faultlog 解析，跨平台，支持 --json 机读输出"
dependencies = ["drain3>=0.9.0,<1.0"]
requires-python = ">=3.10"

[project.scripts]
logscope-triage = "logscope_triage:main"
hiagent-crg = "hiagent_tools.crg_gate:main"
hiagent-run = "hiagent_tools.run_dir:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logscope_triage", "src/hiagent_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8,<9"]
