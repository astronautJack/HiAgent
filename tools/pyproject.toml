[project]
name = "logscope-triage"
version = "0.4.0"
description = "LogScope 日志分流 CLI：Drain3 通用模板挖掘 + 跨 run 持久化 + --json 机读输出，跨平台无平台专用 parser"
dependencies = ["drain3>=0.9.0,<1.0"]
requires-python = ">=3.10"

[project.scripts]
logscope-triage = "logscope_triage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logscope_triage"]
